<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./styles/login.css">
</head>
<body>
    <header>
        <nav>
            <img src="./images/logo-videobelajar.png" alt="logo-videobelajar">
        </nav>
    </header>
    <div class="wrapper">
        <main class="container">
            <div class="card">
                <div class="card-title">
                    <h1>Masuk ke Akun</h1>
                    <p>Yuk, lanjutin belajarmu di videobelajar.</p>
                </div>
                <form action="#" method="post">
                        <div class="form-group">
                            <label for="email">E-Mail</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Kata Sandi</label>
                            <input type="password" id="password" name="password" required>
                            <img src="./images/eye-off-icon.png" alt="eye-off-icon" class="eye-off">
                        </div>
                        <div class="form-forgot-password">
                            <a href="#">Lupa password?</a>
                        </div>
                        <div class="form-button">
                            <button type="submit" class="login-button">Masuk</button>
                            <a href="./register.html" class="register-button">Daftar</a>
                            <p>atau</p>
                            <button type="button" class="google-button"><img src="./images/google-icon.png" alt="google-icon">Masuk dengan Google</button>
                        </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
